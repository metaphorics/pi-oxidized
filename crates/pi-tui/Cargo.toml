[package]
name = "pi-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
testkit = ["dep:avt", "dep:portable-pty", "dep:serde_json", "dep:sha2"]
bench = ["dep:pi-bench-alloc"]

[dependencies]
base64 = "=0.23.1"
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "event-stream", "events"] }
futures = { version = "=0.3.34", default-features = false, features = ["alloc", "async-await"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "scrolling-regions", "underline-color"] }
thiserror = "=2.0.20"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "=1.13.3"
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
unicode-width = "=0.2.2"
avt = { version = "=0.18.0", optional = true }
portable-pty = { version = "=0.9.0", optional = true }
serde_json = { version = "=1.0.151", optional = true }
sha2 = { version = "=0.11.0", optional = true }
pi-bench-alloc = { version = "=0.1.0", path = "../../bench/pi-bench-alloc", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll", "process", "signal", "term"] }

[dev-dependencies]
avt = "=0.18.0"
insta = "=1.48.0"
portable-pty = "=0.9.0"
proptest = "=1.11.0"
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[[bin]]
name = "pi_tui_pty_fixture"
path = "src/bin/pi_tui_pty_fixture.rs"

[[bin]]
name = "pi_tui_transcript_validator"
path = "src/bin/pi_tui_transcript_validator.rs"
required-features = ["testkit"]

[[bin]]
name = "pi_tui_static_frame_fixture"
path = "src/bin/pi_tui_static_frame_fixture.rs"

[[bin]]
name = "pi_tui_ext_fixture"
path = "src/bin/pi_tui_ext_fixture.rs"

[[bin]]
name = "pi_tui_state_matrix_fixture"
path = "src/bin/pi_tui_state_matrix_fixture.rs"


[[bin]]
name = "pi_tui_a11y_fixture"
path = "src/bin/pi_tui_a11y_fixture.rs"

[[bin]]
name = "pi_tui_render_churn_bench"
path = "src/bin/pi_tui_render_churn_bench.rs"
required-features = ["bench"]

[[bin]]
name = "pi_tui_unicode_gauntlet_fixture"
path = "src/bin/pi_tui_unicode_gauntlet_fixture.rs"

